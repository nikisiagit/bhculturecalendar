# Content Sync: Notion → Mobile API (fast path for ~1 minute freshness).
# See docs/near-realtime.md and docs/setup-and-verification.md
#
# Required GitHub secrets:
#   NOTION_API_KEY
#   NOTION_DATABASE_ID
#   MOBILE_SYNC_SECRET
#   CLOUDFLARE_DEPLOY_HOOK  (optional for user-facing freshness; still used for SEO HTML)
# Optional:
#   MOBILE_API_URL   (use *.workers.dev in CI to avoid bot challenges)

name: Content Sync

on:
  # Prefer Cloudflare Worker cron/trigger (workers/content-sync-trigger).
  # This GH schedule is a backup (same cadence: every 12 hours UTC).
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  # Fired by CF Worker (or manual API): POST /trigger → repository_dispatch
  repository_dispatch:
    types: [content-sync, notion-update]

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Notion → Mobile API
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MOBILE_SYNC_SECRET: ${{ secrets.MOBILE_SYNC_SECRET }}
          MOBILE_API_URL: ${{ secrets.MOBILE_API_URL }}
        run: npm run sync-mobile-api

      - name: Verify API + Notion parity (app & site data path)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MOBILE_API_URL: ${{ secrets.MOBILE_API_URL }}
        run: npm run verify:content

      # Site UI polls the API live; deploy keeps static HTML/SEO closer to current data.
      - name: Redeploy Cloudflare Pages (SEO shell)
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "No CLOUDFLARE_DEPLOY_HOOK — skipping Pages rebuild."
            echo "Users still see fresh events via client-side API polling."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"
          echo "Cloudflare Pages deploy hook triggered."
