# Content Sync: Notion → Mobile API, verify parity, then rebuild Cloudflare Pages.
# See AGENTS.md and docs/setup-and-verification.md
#
# Required GitHub secrets:
#   NOTION_API_KEY
#   NOTION_DATABASE_ID
#   MOBILE_SYNC_SECRET
#   CLOUDFLARE_DEPLOY_HOOK
# Optional:
#   MOBILE_API_URL   (defaults in scripts to production API)
#   SITE_URL         (e.g. https://bhculturecalendar.co.uk — origin smoke check)

name: Content Sync

on:
  schedule:
    # Once daily 06:00 UTC — adjust if you prefer UK morning
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Notion → Mobile API
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MOBILE_SYNC_SECRET: ${{ secrets.MOBILE_SYNC_SECRET }}
          MOBILE_API_URL: ${{ secrets.MOBILE_API_URL }}
        run: npm run sync-mobile-api

      - name: Verify API + Notion parity (app & site data path)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MOBILE_API_URL: ${{ secrets.MOBILE_API_URL }}
          # Do not pass SITE_URL here: public HTML is often 403 from GHA (Cloudflare bot
          # fight). Content correctness is Notion↔API + public API health only.
        run: npm run verify:content

      - name: Redeploy Cloudflare Pages
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "Missing secret CLOUDFLARE_DEPLOY_HOOK"
            echo "Create a Deploy Hook in Cloudflare Pages → Settings → Deploy hooks"
            echo "and add the URL as a GitHub Actions repository secret named CLOUDFLARE_DEPLOY_HOOK."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"
          echo "Cloudflare Pages deploy hook triggered."
