name: Sync Mobile API

on:
  schedule:
    # Run shortly after the daily website rebuild
    - cron: "45 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Validate required secrets
        run: |
          missing=0
          for name in NOTION_API_KEY NOTION_DATABASE_ID MOBILE_SYNC_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets at Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MOBILE_SYNC_SECRET: ${{ secrets.MOBILE_SYNC_SECRET }}

      - name: Sync Notion events to mobile API
        run: npm run sync:mobile
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # workers.dev bypasses Cloudflare bot challenges that block GitHub Actions on the custom domain
          MOBILE_API_URL: https://bh-culture-calendar-api.nikitavo.workers.dev
          MOBILE_SYNC_SECRET: ${{ secrets.MOBILE_SYNC_SECRET }}