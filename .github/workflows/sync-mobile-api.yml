name: Sync Mobile API

on:
  schedule:
    # Run shortly after the daily website rebuild
    - cron: "45 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync Notion events to mobile API
        run: npm run sync:mobile
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MOBILE_API_URL: ${{ secrets.MOBILE_API_URL }}
          MOBILE_SYNC_SECRET: ${{ secrets.MOBILE_SYNC_SECRET }}